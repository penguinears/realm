<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Realm</title>
<style>
/* Set the background image for the whole page */
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: url('background.webp') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
}

/* Main container */
main {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(0,0,0,0.7);
    border-radius: 16px;
}

/* Story section */
#server-story {
    margin-bottom: 40px;
}
#server-story h2 {
    color: #ffcc00;
    margin-bottom: 10px;
}

/* Wanted poster */
#wanted-poster {
    max-width: 400px;
    background: #fff;
    color: #000;
    border: 4px solid #000;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    margin: 0 auto;
}

#wanted-poster h2 {
    margin-top: 0;
    color: red;
    font-size: 1.5em;
}

#wanted-poster img {
    width: 100%;
    height: auto;
    border: 2px solid #000;
    margin-bottom: 10px;
}
</style>
</head>
<body>
<main>
    <!-- Server Story Section -->
    <section id="server-story">
        <h2>Server Story</h2>
        <p>Write the story of your Minecraft realm here...</p>
    </section>

    <!-- Wanted Poster -->
    <section id="wanted-poster">
        <h2>WANTED</h2>
        <img src="placeholder.png" alt="Rowan's image">
        <p><strong>Rowan</strong></p>
        <p>For burning down the DIH house</p>
    </section>
</main>
</body>
</html>
